version: '3.8'

services:
  # ============================================
  # PostgreSQL - основная база данных
  # Хранит: пользователей, балансы, транзакции, ledger
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: wallet_postgres
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_secret_password
      POSTGRES_DB: wallet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - кэш и распределённые блокировки
  # Используется для:
  # - Блокировки балансов во время транзакций
  # - Idempotency ключи (защита от double-spend)
  # - Кэш курса TON/USDT
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: wallet_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (будет добавлен позже)
  # ============================================
  # backend:
  #   build: ./backend
  #   container_name: wallet_backend
  #   depends_on:
  #     - postgres
  #     - redis
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local